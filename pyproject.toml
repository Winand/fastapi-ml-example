[project]
name = "fastapi-ml-example"
version = "0.1.0"
description = "ML web-service template"
readme = "README.md"
authors = [
    { name = "Andrey Makarov", email = "winandfx@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.140.7",  # https://fastapi.tiangolo.com/#dependencies
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",  # https://uvicorn.dev/installation/#optional-dependencies
]

[project.scripts]
fastapi-ml-example = "fastapi_ml_example.main:main"
train = "fastapi_ml_example.ml.train:cli"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # for FastAPI TestClient
    "httpx2>=2.9.1",
    "pandas-stubs>=3.0.5.260730",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
]
